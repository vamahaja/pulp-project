apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: pulp-operator-group
  namespace: ${PULP_NAMESPACE}

---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: pulp-operator
  namespace: ${PULP_NAMESPACE}
spec:
  channel: stable
  name: pulp-operator
  source: community-operators
  sourceNamespace: openshift-marketplace

---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager

---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: cert-manager-operator-group
  namespace: cert-manager
spec:
  targetNamespaces: []

---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  channel: stable
  name: cert-manager
  source: community-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic

---
